<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="CrowRules Yearbooks is under development. Coming soon.">
  <title>CrowRules Yearbooks — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --cyan:#55e7ff; --purple:#a879ff; --bg:#080b16; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; overflow:hidden; color:#f5f7ff; font-family:Montserrat,Arial,sans-serif; background:radial-gradient(ellipse at 18% 18%,rgba(85,231,255,.14),transparent 38%),radial-gradient(ellipse at 82% 78%,rgba(168,121,255,.16),transparent 40%),var(--bg); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.2; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:42px 42px; mask-image:linear-gradient(to bottom,black,transparent 90%); }
    main { position:relative; width:min(760px,100%); padding:clamp(32px,7vw,72px) clamp(24px,6vw,64px); text-align:center; border:1px solid rgba(126,204,255,.28); border-radius:24px; background:linear-gradient(145deg,rgba(18,25,47,.94),rgba(10,13,29,.92)); box-shadow:0 0 70px rgba(85,231,255,.08),0 25px 90px rgba(0,0,0,.35); }
    .mark { width:78px;height:78px;margin:0 auto 28px;display:grid;place-items:center;border:1px solid rgba(85,231,255,.65);border-radius:22px;color:var(--cyan);font:800 30px Orbitron,sans-serif;text-shadow:0 0 18px rgba(85,231,255,.65);box-shadow:inset 0 0 24px rgba(85,231,255,.08),0 0 28px rgba(85,231,255,.12);transform:rotate(-4deg); }
    .eyebrow { color:var(--cyan);font-size:.76rem;font-weight:800;letter-spacing:.25em;text-transform:uppercase; }
    h1 { margin:18px 0 14px;font:800 clamp(2rem,7vw,4.1rem)/1.12 Orbitron,sans-serif;letter-spacing:-.045em; }
    h1 span { display:block;color:var(--cyan);text-shadow:0 0 28px rgba(85,231,255,.2); }
    .status { display:inline-flex;align-items:center;gap:10px;margin:18px 0 22px;padding:10px 16px;border:1px solid rgba(168,121,255,.45);border-radius:999px;background:rgba(168,121,255,.09);color:#d8c6ff;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase; }
    .dot { width:8px;height:8px;border-radius:50%;background:#b994ff;box-shadow:0 0 12px #a879ff; }
    p { max-width:520px;margin:0 auto;color:#b9c3d9;font-size:1rem;line-height:1.8; }
    .tagline { margin-top:32px;color:#8794af;font-size:.8rem;letter-spacing:.12em; }
    .tagline strong { color:#e4e9f8;font-weight:600; }
    @media (prefers-reduced-motion:no-preference) { .dot { animation:pulse 2s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.45;box-shadow:0 0 3px #a879ff; } } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CR</div>
    <div class="eyebrow">CrowRules Entertainment</div>
    <h1>CrowRules <span>Yearbooks</span></h1>
    <div class="status"><span class="dot" aria-hidden="true"></span> Under Development</div>
    <p>Every year has a story worth remembering. We're building CrowRules Yearbooks—more details and updates are coming soon.</p>
    <div class="tagline"><strong>One company. One universe.</strong></div>
  </main>
</body>
</html>

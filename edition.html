<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>CrowRules Yearbook Edition</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#030308;--panel:#0d0d15;--line:#252530;--text:#f5f5fa;--muted:#a0a0ad;--red:#e10600;--cyan:#5ee7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(225,6,0,.16),transparent 35%),var(--bg);color:var(--text);font:15px Montserrat,Arial,sans-serif}.wrap{width:min(900px,92%);margin:auto}.top{padding:20px 0;border-bottom:1px solid var(--line);font:800 11px Orbitron;letter-spacing:2px}.top span{color:var(--red)}main{padding:55px 0 90px}.eyebrow{color:#ff6b66;font:800 9px Orbitron;letter-spacing:3px}.hero{text-align:center;padding:20px 0 45px}.hero h1{font:800 clamp(32px,7vw,70px) Orbitron;margin:14px 0}.hero p{color:var(--muted);line-height:1.7}.page{background:linear-gradient(180deg,#11111a,#08080d);border:1px solid var(--line);border-radius:18px;padding:30px;margin:16px 0;min-height:180px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.page.cover{text-align:center;min-height:360px;display:flex;flex-direction:column;justify-content:center}.page h2{font:800 22px Orbitron;margin:0 0 14px}.page h3{font:700 15px Orbitron;color:var(--cyan);margin:20px 0 8px}.page p{color:#ddd;line-height:1.8;white-space:pre-wrap}.meta{font-size:11px;color:var(--muted)}.error{padding:25px;border:1px solid #5a2525;border-radius:15px;color:#ff9b96;background:#120808}@media print{body{background:#fff;color:#111}.top{display:none}.page{break-inside:avoid;background:#fff;border:1px solid #bbb;color:#111;box-shadow:none}.page p,.meta{color:#222}.page h3{color:#111}}</style></head>
<body><div class="top"><div class="wrap">CROWRULES <span>YEARBOOKS</span></div></div><main class="wrap"><div id="app"><p>Loading edition…</p></div></main>
<script>(async()=>{const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-");const app=document.querySelector("#app"),slug=new URLSearchParams(location.search).get("slug");const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));if(!slug){app.innerHTML='<div class="error">No edition slug was provided.</div>';return}const {data,error}=await db.from("yearbook_editions").select("title,subtitle,description,year,slug,edition_data,published_at").eq("slug",slug).eq("status","published").eq("visibility","public").maybeSingle();if(error||!data){app.innerHTML='<div class="error">This yearbook edition is unavailable or is not publicly published.</div>';return}const ed=data.edition_data||{},pages=Array.isArray(ed.pages)?ed.pages:[],stories=Array.isArray(ed.stories)?ed.stories.filter(x=>x.status==="Approved"):[],credits=Array.isArray(ed.credits)?ed.credits.filter(x=>x.status==="Final"):[];app.innerHTML='<section class="hero"><div class="eyebrow">CROWRULES YEARBOOK • '+esc(data.year||"")+'</div><h1>'+esc(data.title)+'</h1><p>'+esc(data.description||data.subtitle||"A CrowRules Yearbook edition.")+'</p></section><div id="pages"></div>';const out=document.querySelector("#pages");pages.forEach((p,i)=>{const el=document.createElement("section");el.className="page"+(i===0?" cover":"");let body="";if(i===0)body='<p>'+esc(data.title)+'</p>';else if(i===3&&stories.length)body=stories.map(s=>'<h3>'+esc(s.title||"Untitled Story")+'</h3><p>'+esc(s.body||"")+'</p><div class="meta">'+esc(s.contributor||"Contributor")+'</div>').join("");else if(i===6&&credits.length)body=credits.map(x=>'<p><strong>'+esc(x.name||"Unnamed")+'</strong> • '+esc(x.role||"Other")+' • '+esc(x.section||"Other")+'</p>').join("");else body='<p>This page is part of the published CrowRules Yearbook edition.</p>';el.innerHTML='<div class="eyebrow">PAGE '+String(i+1).padStart(2,"0")+'</div><h2>'+esc(p.title||("Page "+(i+1)))+'</h2>'+body;out.appendChild(el)})})().catch(e=>{document.querySelector("#app").innerHTML='<div class="error">Unable to load this edition.</div>'});</script></body></html>

name: CrowRules Universal Notifications V3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject notifications engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script='<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if 'crowrules-notifications.js?v=3' not in s and '</head>' in s:
                  p.write_text(s.replace('</head>', script+'\n</head>',1),encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "CrowRules Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "V3 inject Universal Notifications Engine" && git push)
